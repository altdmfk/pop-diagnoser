name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Node.js (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run test suite (root entry point)
        run: node test.js

      - name: Run test suite (direct test runner)
        run: node test/test.js

      - name: Verify golden pass fixture
        run: node tools/golden_pass.js

      - name: Check UTF-8 encoding (no BOM, no U+FFFD)
        run: python tools/check_encoding.py

