<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>PoP Diagnoser Tests</title>
</head>
<body>
    <h1>PoP Diagnoser Test Runner</h1>
    <div id="results"></div>
    <script src="fixtures.js"></script>
    <script src="diagnose-core.js"></script>
    <script src="test.js"></script>
    <script>
        // Note: test.js was written for Node. To make it run in browser, 
        // we intercept console.log to print to DOM.
        const resultsDiv = document.getElementById('results');
        const originalLog = console.log;
        console.log = function(...args) {
            originalLog.apply(console, args);
            const p = document.createElement('p');
            p.textContent = args.join(' ');
            if (args[0] && args[0].includes('[FAIL]')) p.style.color = 'red';
            if (args[0] && args[0].includes('Tests completed')) p.style.fontWeight = 'bold';
            resultsDiv.appendChild(p);
        };
        // Run tests (test.js executes automatically)
        setTimeout(() => {
            if (typeof window.FIXTURES !== 'undefined') {
                runTests().catch(console.error);
            } else {
                console.log("[ERROR] FIXTURES not loaded");
            }
        }, 100);
    </script>
</body>
</html>
